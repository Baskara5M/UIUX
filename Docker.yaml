services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/testpwd123                       # password: at least 8 characters
      NEO4J_server_default__listen__address: 0.0.0.0     # accept connections from other containers
      NEO4J_server_memory_heap_max__size: 1G             # optional; plenty for this data
      NEO4J_server_memory_pagecache_size: 512M           # optional
    ports:
      - "7474:7474"                                      # Neo4j Browser, from the host (optional)
      - "7687:7687"                                      # Bolt, from the host (optional; containers don't need it)
    volumes:
      - neo4j-data:/data                                 # the database: survives "docker compose down"
      - neo4j-logs:/logs                                 # Neo4j's logs: also kept (optional)
      - ./neo4j-datamodel:/var/lib/neo4j/import:ro       # CSV files + load.cypher; use :ro,z on RHEL/CentOS/Rocky/Fedora
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpwd123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .                                             # the Dockerfile in this folder
    container_name: python-backend
    environment:
      NEO4J_URI: bolt://neo4j:7687                       # the service name above, not localhost
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpwd123                         # same as in NEO4J_AUTH
      NEO4J_DATABASE: neo4j
      SEA_NETWORK_PORT: "8100"
      PYTHONUNBUFFERED: "1"                              # print() shows up in "docker logs" at once
    ports:
      - "8100:8100"                                      # http://<server>:8100
    depends_on:
      neo4j:
        condition: service_healthy                       # start only once Neo4j answers
    restart: on-failure:5                                # stop retrying after 5 failed starts

volumes:
  neo4j-data:                                            # named volume: removed only by "down -v"
  neo4j-logs: