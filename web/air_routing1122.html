<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALCON Air Network</title>
<style>
  :root {
    --bg: #11161c; --panel: #172029; --line: #2b3742; --ink: #e6edf3; --dim: #8b9bab;
    --ocean: #0a1a26; --land: #27343f; --coast: #445a6b; --bad: #e8604c;
    --origin: #4ad4a0; --dest: #e8604c; --air: #7cc4f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px 18px; }
  header .titles { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  /* Sea / Air tabs: links between index.html (Sea) and air_routing.html (Air) */
  .tabs { display: flex; flex: none; padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .tabs a { min-width: 64px; padding: 5px 14px; border: 1px solid transparent; border-radius: 6px; text-align: center;
            text-decoration: none; color: var(--dim); font-weight: 600; font-size: 13px; }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { background: #1d2833; color: var(--ink); border-color: var(--origin); }
  .tabs a:focus-visible { outline: 2px solid var(--origin); outline-offset: 1px; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  aside { width: 350px; flex: none; padding: 14px 18px; border-right: 1px solid var(--line); overflow-y: auto; }
  label, .sec { display: block; margin: 12px 0 4px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .sec { margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  aside input, button.go { width: 100%; padding: 7px 9px; background: var(--panel); color: var(--ink);
          border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  button.go { margin-top: 14px; font-weight: 600; cursor: pointer; }
  aside :disabled { opacity: .45; cursor: not-allowed; }
  #msg { margin-top: 12px; font-size: 12.5px; color: var(--dim); }
  #msg.err { color: var(--bad); }
  #results { list-style: none; padding: 0; margin: 10px 0 0; }
  #results li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: #1d2833; }
  .top { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .sw { width: 22px; height: 4px; border-radius: 2px; flex: none; background: var(--origin); }
  .delta { color: var(--dim); font-weight: 400; font-size: 12.5px; margin-left: auto; }
  .via { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .lbl { fill: var(--ink); paint-order: stroke; stroke: var(--bg); font-weight: 600; pointer-events: none; }
  .wlbl { fill: var(--ink); paint-order: stroke; stroke: var(--bg); pointer-events: none; }
  button { padding: 4px 10px; background: rgba(17,22,28,.9); color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  button:hover { border-color: var(--origin); }
  .legend { color: var(--dim); font-size: 12.5px; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend .dot { border-radius: 50%; background: var(--air); flex: none; }
  .legend.err { color: var(--bad); }
  .hint { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .map { flex: 1; position: relative; background: var(--ocean); min-width: 0; }
  svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg.panning { cursor: grabbing; }
  .tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
  /* Hover card: the name of the nearest airfield under the pointer */
  .tip { position: absolute; z-index: 2; pointer-events: none; max-width: 320px; padding: 6px 10px;
         border-radius: 6px; background: rgba(17,22,28,.96); border: 1px solid var(--line);
         box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: 12.5px; line-height: 1.45; }
  .tip b { display: block; color: #fff; font-size: 13px; }
  .tip .d { color: var(--dim); }
  .tip .near { color: var(--dim); font-size: 12px; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  #airfields circle { fill: var(--air); pointer-events: none; }
  #airfields .medium { fill-opacity: .55; }
  #airfields .large { fill-opacity: .9; }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; }
    .wrap { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--line); max-height: 48%; }
    .map { min-height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1>FALCON Air Network</h1>
    <p>Air routes between airfields along the airways. Point at a dot on the map for the airfield's name.</p>
  </div>
  <nav class="tabs" aria-label="Transport">
    <a href="/">Sea</a>
    <a href="/air_routing.html" aria-current="page">Air</a>
  </nav>
</header>
<div class="wrap">
  <aside>
    <label for="from">Origin airfield</label>
    <input id="from" list="fields" autocomplete="off" placeholder="Type an airfield name or code">
    <label for="to">Destination airfield</label>
    <input id="to" list="fields" autocomplete="off" placeholder="Type an airfield name or code">
    <datalist id="fields"></datalist>
    <button class="go" id="go">Find route</button>
    <p class="hint" id="coverage"></p>
    <div id="msg"></div>
    <ol id="results"></ol>
    <div class="sec">Airfields on the map</div>
    <div class="legend" id="legend">Loading airfields...</div>
    <p class="hint">Point at a dot on the map for the airfield's name. The mouse wheel zooms and dragging pans.</p>
  </aside>
  <div class="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="Map of airfields">
      <rect id="ocean" fill="var(--ocean)"/>
      <g id="land"></g><g id="airfields"></g><g id="route"></g><g id="marks"></g><g id="hoverRing"></g>
    </svg>
    <div class="tools"><button id="fit">Fit route</button><button id="world">World</button></div>
    <div class="tip" id="tip" role="tooltip" hidden></div>
  </div>
</div>

<script src="/vendor/d3-array.min.js"></script>
<script src="/vendor/d3-geo.min.js"></script>
<script src="/vendor/topojson-client.min.js"></script>
<script>
// The Air page. The map (projection, pan, zoom) works as on the Sea page, index.html.
// The airfields come from GET /api/airports and the routes from POST /api/air/routes;
// air_routing.py reads both the airfields and the airways from Neo4j.
const W = 960, H = 480;
// Rotated so the Pacific sits in the middle, as on the Sea page.
const projection = d3.geoEquirectangular().rotate([-159, 0]).scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
const geoPath = d3.geoPath(projection);
const DOT = { large: 2.3, medium: 1.7 };   // dot radius, in screen-sized units

const el = id => document.getElementById(id);
const svg = el("svg");
const svgEl = (tag, attrs) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const fmt = n => n.toLocaleString();

let view = { x: 0, y: 0, w: W, h: H };
let airfields = null, dotScale = null;
let airPts = null;                           // every airfield with its map position, for the hover card

// ------------------------------------------------------------------ view
function setView(v) {
  // Match the svg's on-screen shape so the mapping from screen to map stays linear.
  const r = svg.getBoundingClientRect(), ar = (r.width || W) / (r.height || H);
  let { x, y, w, h } = v;
  if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; }
  else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
  view = { x, y, w, h };
  svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
  const o = el("ocean");
  o.setAttribute("x", x - w); o.setAttribute("y", y - h); o.setAttribute("width", w * 3); o.setAttribute("height", h * 3);
  sizeDots(); drawRoute();
}
const scale = () => view.w / W;          // map units per screen-sized unit at this zoom

function toMap(e) {
  const r = svg.getBoundingClientRect();
  return [view.x + (e.clientX - r.left) / r.width * view.w, view.y + (e.clientY - r.top) / r.height * view.h];
}

// ------------------------------------------------------------- airfields
const sizeOf = a => a.type === "large" ? "large" : "medium";

function drawAirfields() {
  const g = el("airfields"); g.innerHTML = "";
  airPts = airfields.map(a => ({ ...a, xy: projection([a.lon, a.lat]) }));
  // Medium first, so the larger, brighter large-airport dots sit on top.
  for (const size of ["medium", "large"]) {
    for (const a of airfields) {
      if (sizeOf(a) !== size) continue;
      const [x, y] = projection([a.lon, a.lat]);
      g.appendChild(svgEl("circle", { cx: x, cy: y, class: size }));
    }
  }
  dotScale = null; sizeDots();
}

function sizeDots() {
  // Same size on screen at every zoom.
  const s = scale();
  if (!airfields || s === dotScale) return;  // panning doesn't change the zoom
  dotScale = s;
  for (const c of el("airfields").children) c.setAttribute("r", DOT[c.getAttribute("class")] * s);
}

function showLegend() {
  const lg = el("legend"); lg.className = "legend"; lg.innerHTML = "";
  const large = airfields.filter(a => sizeOf(a) === "large").length;
  for (const [text, n, px, op] of [["Large airport", large, 7, 1],
                                   ["Medium airport, incl. most air bases", airfields.length - large, 5, .6]]) {
    const row = document.createElement("div"), dot = document.createElement("span");
    dot.className = "dot"; dot.style.width = dot.style.height = px + "px"; dot.style.opacity = op;
    row.append(dot, `${text} (${fmt(n)})`);
    lg.appendChild(row);
  }
}

// ---------------------------------------------------------------- routes
// Routes come from POST /api/air/routes: the shortest way along the airways.
let byLabel = {}, byId = {}, last = null;    // picker label -> airfield id; id -> airfield; the last answer
const codeOf = a => a.icao || a.iata || a.id;

function fillPickers() {
  // Only airfields on the airway network can be routed, so only those are offered.
  const usable = airfields.filter(a => a.on_airways), count = {}, list = el("fields");
  const base = a => `${a.name} (${codeOf(a)})${a.country ? ", " + a.country : ""}`;
  for (const a of usable) count[base(a)] = (count[base(a)] || 0) + 1;
  for (const a of airfields) byId[a.id] = a;
  for (const a of usable) {
    const label = count[base(a)] > 1 ? `${base(a)} [${a.id}]` : base(a);
    byLabel[label] = a.id;
    list.appendChild(new Option(label));
  }
  const labelOf = id => Object.keys(byLabel).find(l => byLabel[l] === id);
  const labels = Object.keys(byLabel);
  el("coverage").textContent = usable.length
    ? `${fmt(usable.length)} of ${fmt(airfields.length)} airfields are on the airway network (a waypoint within 25 nm). Only those can be picked.`
    : "No airfield is on the airway network, so no air route can be found. Check that Neo4j holds Waypoint nodes joined by AIRWAY links, then restart the server.";
  for (const id of ["from", "to", "go"]) el(id).disabled = usable.length < 2;
  if (usable.length < 2) return false;
  el("from").value = labelOf("PHNL") || labels[0];
  el("to").value = labelOf("PHTO") || labels.find(l => l !== el("from").value);
  return true;
}

function drawRoute() {
  const g = el("route"), m = el("marks"), s = scale();
  g.innerHTML = ""; m.innerHTML = "";
  const r = last && last.routes && last.routes[0];
  if (r) {
    g.appendChild(svgEl("path", { d: geoPath({ type: "LineString", coordinates: r.line }), fill: "none",
      stroke: "var(--origin)", "stroke-width": 3.4, "stroke-linecap": "round", "stroke-linejoin": "round",
      "vector-effect": "non-scaling-stroke", "pointer-events": "none" }));
    for (const w of r.waypoints) {             // each waypoint the route passes: a ring and its name
      const [x, y] = projection([w.lon, w.lat]);
      g.appendChild(svgEl("circle", { cx: x, cy: y, r: 3.5 * s, fill: "var(--bg)", stroke: "var(--origin)",
        "stroke-width": 2, "vector-effect": "non-scaling-stroke", "pointer-events": "none" }));
      const t = svgEl("text", { x: x + 7 * s, y: y - 6 * s, class: "wlbl", "font-size": 11.5 * s, "stroke-width": 3 * s });
      t.textContent = w.name;
      g.appendChild(t);
    }
  }
  for (const [id, colour, role] of [[last && last.from, "var(--origin)", "Origin"], [last && last.to, "var(--dest)", "Destination"]]) {
    const a = byId[id];
    if (!a) continue;
    const [x, y] = projection([a.lon, a.lat]);
    m.appendChild(svgEl("circle", { cx: x, cy: y, r: 6 * s, fill: colour, stroke: "var(--bg)",
                                     "stroke-width": 2, "vector-effect": "non-scaling-stroke", "pointer-events": "none" }));
    const t = svgEl("text", { x: x + 9 * s, y: y + 14 * s, class: "lbl", "font-size": 13 * s, "stroke-width": 3 * s });
    t.textContent = `${role}: ${codeOf(a)}`;      // the code: airfield names are long
    m.appendChild(t);
  }
}

function fitRoute() {
  const r = last && last.routes && last.routes[0];
  if (!r) return setView({ x: 0, y: 0, w: W, h: H });
  const [[x0, y0], [x1, y1]] = geoPath.bounds({ type: "LineString", coordinates: r.line });
  const pad = Math.max(x1 - x0, y1 - y0) * 0.25 + 1;
  setView({ x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad });
}

function renderResults() {
  const ol = el("results"); ol.innerHTML = "";
  for (const r of (last && last.routes) || []) {
    const li = document.createElement("li");
    const row = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; return d; };
    const top = row("top", ""), sw = document.createElement("span"), extra = row("delta", `${r.hops} leg${r.hops === 1 ? "" : "s"}`);
    sw.className = "sw";
    top.append(sw, `${fmt(Math.round(r.length_nm))} nm`, extra);
    li.append(top, row("via", r.airways.length ? `via airway${r.airways.length === 1 ? "" : "s"} ${r.airways.join(", ")}` : "no named airway"),
              row("via", r.waypoints.map(w => w.name).join(" \u2192 ")));
    ol.appendChild(li);
  }
}

let pending = 0;
async function go(fit = false) {
  const msg = el("msg"), from = byLabel[el("from").value], to = byLabel[el("to").value];
  if (!from || !to) { msg.className = "err"; msg.textContent = "Pick both airfields from the list."; return; }
  msg.className = ""; msg.textContent = "Routing...";
  const ticket = ++pending;
  let data;
  try {
    const res = await fetch("/api/air/routes", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from, to }) });
    data = await res.json();
  } catch (err) {
    data = { error: `Couldn't reach the server: ${err.message}` };
  }
  if (ticket !== pending) return;                 // a newer request has been sent since
  if (data.error) {
    msg.className = "err"; msg.textContent = data.error;
    last = { from, to, routes: [] };
  } else {
    last = data;
    msg.textContent = `Shortest route in ${data.ms} ms`;
  }
  renderResults(); drawRoute();
  if (fit && !data.error) fitRoute();
}

function showError(text) {
  const lg = el("legend"); lg.className = "legend err"; lg.textContent = text;
}

// ---------------------------------------------------------- interaction
let pan = null;
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  pan = { x: e.clientX, y: e.clientY, view: { ...view } };
  svg.classList.add("panning"); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!pan) return;
  const r = svg.getBoundingClientRect();
  setView({ ...pan.view, x: pan.view.x - (e.clientX - pan.x) / r.width * pan.view.w,
                         y: pan.view.y - (e.clientY - pan.y) / r.height * pan.view.h });
});
svg.addEventListener("pointerup", () => { pan = null; svg.classList.remove("panning"); });
svg.addEventListener("pointercancel", () => { pan = null; svg.classList.remove("panning"); });
// ---------------------------------------------------------------- hover
// Pointing at the map shows the name of the nearest airfield within HOVER_PX pixels.
const HOVER_PX = 10;

function hideTip() {
  el("tip").hidden = true;
  el("hoverRing").innerHTML = "";
}

function showTip(e) {
  const ctm = svg.getScreenCTM();
  if (!ctm || !airPts) return hideTip();
  const near = [];
  for (const it of airPts) {
    const d = Math.hypot(ctm.a * it.xy[0] + ctm.e - e.clientX, ctm.d * it.xy[1] + ctm.f - e.clientY);
    if (d <= HOVER_PX) near.push([d, it]);
  }
  if (!near.length) return hideTip();
  near.sort((p, q) => p[0] - q[0]);
  const it = near[0][1], tip = el("tip");
  // Text only (textContent), never HTML: the names come from the data.
  const line = (tag, cls, text) => { const n = document.createElement(tag); n.className = cls; n.textContent = text; return n; };
  tip.replaceChildren(line("b", "", it.name), line("div", "d", tipDetail(it)));
  if (near.length > 1) {
    const others = near.slice(1, 4).map(n => n[1].name).join(", ") + (near.length > 4 ? ` and ${near.length - 4} more` : "");
    tip.appendChild(line("div", "near", `Also here: ${others}. Zoom in to tell them apart.`));
  }
  tip.hidden = false;
  // Next to the pointer, flipped left / up near the map's right and bottom edges.
  const box = svg.parentElement.getBoundingClientRect();
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + tip.offsetWidth > box.width - 8) x = e.clientX - box.left - 14 - tip.offsetWidth;
  if (y + tip.offsetHeight > box.height - 8) y = e.clientY - box.top - 14 - tip.offsetHeight;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
  el("hoverRing").replaceChildren(svgEl("circle", { cx: it.xy[0], cy: it.xy[1], r: 5.5 * scale(), fill: "none",
    stroke: "#fff", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke", "pointer-events": "none" }));
}

// Hidden while panning or zooming. Touch screens have no hover.
svg.addEventListener("pointermove", e => {
  if (pan || e.pointerType === "touch") return hideTip();
  showTip(e);
});
svg.addEventListener("pointerdown", hideTip);
svg.addEventListener("pointerleave", hideTip);
svg.addEventListener("wheel", hideTip, { passive: true });

const tipDetail = a => [[a.icao, a.iata].filter(Boolean).join(" / ") || a.id, a.country,
                       a.runway_ft ? `runway ${fmt(a.runway_ft)} ft` : ""].filter(Boolean).join(" · ");

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const [mx, my] = toMap(e), f = e.deltaY < 0 ? 0.8 : 1.25;
  const w = Math.min(W * 1.2, Math.max(W / 60, view.w * f)), k = w / view.w;
  setView({ x: mx - (mx - view.x) * k, y: my - (my - view.y) * k, w, h: view.h * k });
}, { passive: false });

async function boot() {
  el("world").onclick = () => setView({ x: 0, y: 0, w: W, h: H });
  el("fit").onclick = fitRoute;
  el("go").onclick = () => go(true);
  for (const id of ["from", "to"]) el(id).addEventListener("keydown", e => { if (e.key === "Enter") go(true); });
  for (const id of ["from", "to", "go"]) el(id).disabled = true;      // until the airfields are in
  window.addEventListener("resize", () => setView(view));
  setView({ x: 0, y: 0, w: W, h: H });

  const topo = await (await fetch("/land.json")).json();
  el("land").appendChild(svgEl("path", { d: geoPath(topojson.feature(topo, topo.objects.land)), fill: "var(--land)",
    stroke: "var(--coast)", "stroke-width": 0.7, "vector-effect": "non-scaling-stroke" }));

  let res, data;
  try {
    res = await fetch("/api/airports");
    data = await res.json();
  } catch (err) {
    return showError(`Couldn't load the airfields (/api/airports): ${err.message}`);
  }
  if (!res.ok || !Array.isArray(data)) return showError((data && data.error) || `Couldn't load the airfields (HTTP ${res.status}).`);
  airfields = data;
  drawAirfields(); showLegend();
  if (fillPickers()) go(true);
}
boot();
</script>
</body>
</html>
